<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عقارات وأراضي الطفيلة - التطبيق الشامل</title>
    <style>
        /* التنسيقات العامة والخلفية */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(rgba(18, 38, 28, 0.85), rgba(18, 38, 28, 0.85)), url('bg.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            margin: 0; padding: 15px 10px; display: flex; justify-content: center; min-height: 100vh;
        }
        .app-container {
            background-color: rgba(255, 255, 255, 0.97); width: 100%; max-width: 500px;
            border-radius: 20px; border: 2px solid #c59b27; padding: 20px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); height: fit-content;
        }

        /* الهيدر والشعار */
        .header { text-align: center; margin-bottom: 15px; }
        .logo { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #c59b27; }
        .tag { background: #1b4332; color: #f4e8c1; font-size: 11px; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
        h1 { color: #1b4332; font-size: 20px; margin: 5px 0 2px 0; }
        .slogan { color: #c59b27; font-size: 12px; font-weight: bold; margin-bottom: 10px; }

        /* شريط التنقل العلوي */
        .nav-tabs { display: flex; gap: 5px; background: #f0f0f0; padding: 5px; border-radius: 12px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 8px 4px; border: none; background: none; font-weight: bold;
            font-size: 12px; color: #555; cursor: pointer; border-radius: 8px; transition: 0.3s;
        }
        .tab-btn.active { background: #1b4332; color: #f4e8c1; }

        /* إخفاء وإظهار الأقسام */
        .section { display: none; }
        .section.active { display: block; }

        /* نماذج الإدخال والبحث */
        .form-group { margin-bottom: 10px; text-align: right; }
        label { font-size: 12px; font-weight: bold; color: #333; display: block; margin-bottom: 4px; }
        input, select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px;
        }
        input[type="file"] { padding: 5px; }
        
        .btn-main {
            width: 100%; background: #1b4332; color: #fff; border: none; padding: 10px;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px;
        }
        .btn-admin { background: #c59b27; color: #000; }

        /* بطاقات العقارات والصور */
        .property-card {
            background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 12px;
            margin-bottom: 12px; text-align: right; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .property-card.pinned {
            border: 2px solid #c59b27;
            background: #fffdf5;
        }
        .property-image {
            width: 100%; height: 160px; object-fit: cover; border-radius: 8px;
            margin-bottom: 10px; border: 1px solid #eee;
        }
        .property-title { font-weight: bold; color: #1b4332; font-size: 15px; }
        .property-price { color: #c59b27; font-weight: bold; font-size: 13px; margin: 3px 0; }
        .property-details { font-size: 12px; color: #666; margin-bottom: 8px; line-height: 1.5; }
        .property-phone { font-size: 13px; font-weight: bold; color: #1877f2; display: block; margin-bottom: 8px; direction: ltr; text-align: right; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; margin-bottom: 8px;}
        .badge-pending { background: #ffeaa7; color: #d63031; }
        .badge-approved { background: #2ecc71; color: #fff; }
        .badge-pinned { background: #c59b27; color: #fff; margin-right: 5px; }

        /* أزرار الإدارة */
        .actions-btn { display: flex; gap: 5px; margin-top: 10px; }
        .btn-sm { padding: 8px 10px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; text-align: center; }
        .btn-delete { background: #ff7675; color: #fff; }
        .btn-approve { background: #2ecc71; color: #fff; }
        .btn-pin { background: #f39c12; color: #fff; }
        .btn-unpin { background: #7f8c8d; color: #fff; }

        /* صندوق التأكيد المخصص للحذف */
        .confirm-box {
            display: none; background: #fff3cd; padding: 12px; border-radius: 8px; 
            flex-direction: column; align-items: center; margin-top: 10px;
            border: 1px solid #ffeeba;
        }
        .confirm-text { font-size: 13px; font-weight: bold; color: #856404; margin-bottom: 10px; text-align: center; }
        .confirm-actions { display: flex; gap: 5px; width: 100%; }

        .fb-link {
            display: block; text-align: center; background: #1877f2; color: #fff;
            text-decoration: none; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 13px; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر -->
        <div class="header">
            <img src="logo.png" alt="شعار المؤسسة" class="logo" onerror="this.style.display='none'"> <br>
            <span class="tag">محافظة الطفيلة الهاشمية</span>
            <h1>عقارات وأراضي الطفيلة</h1>
            <div class="slogan">من الأصالة إلى الحضارة (بيع • شراء • استثمار)</div>
        </div>

        <!-- شريط الأقسام -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('browseTab', this)">تصفح</button>
            <button class="tab-btn" onclick="switchTab('searchTab', this)">🔍 بحث</button>
            <button class="tab-btn" onclick="switchTab('addTab', this)">➕ إضافة</button>
            <button class="tab-btn" onclick="switchTab('adminTab', this)">⚙️ الإدارة</button>
        </div>

        <!-- 1️⃣ قسم تصفح العقارات -->
        <div id="browseTab" class="section active">
            <div id="approvedPropertiesList"></div>
        </div>

        <!-- 2️⃣ قسم البحث -->
        <div id="searchTab" class="section">
            <div class="form-group">
                <label>ابحث بكلمة مفتاحية:</label>
                <input type="text" id="searchInput" onkeyup="filterProperties()" placeholder="مثال: العيص، أرض...">
            </div>
            <div id="searchResultsList"></div>
        </div>

        <!-- 3️⃣ قسم إضافة عقار -->
        <div id="addTab" class="section">
            <div class="form-group">
                <label>نوع العقار:</label>
                <select id="newType">
                    <option value="بيت/فيلا">بيت / فيلا</option>
                    <option value="أرض">قطعة أرض</option>
                    <option value="شقة">شقة سكنية</option>
                    <option value="محل تجاري">محل تجاري</option>
                </select>
            </div>
            <div class="form-group">
                <label>المنطقة في الطفيلة:</label>
                <input type="text" id="newLocation" placeholder="مثال: العيص، وسط البلد...">
            </div>
            <div class="form-group">
                <label>السعر التقديري (بالدينار):</label>
                <input type="text" id="newPrice" placeholder="مثال: 25000">
            </div>
            <div class="form-group">
                <label>تفاصيل إضافية:</label>
                <textarea id="newDetails" rows="2" placeholder="المساحة، الخدمات..."></textarea>
            </div>
            <div class="form-group">
                <label>رقم هاتف صاحب العقار:</label>
                <input type="tel" id="newUserPhone" placeholder="07XXXXXXXX">
            </div>
            <div class="form-group">
                <label>صورة العقار (يفضل أقل من 2 ميجا):</label>
                <input type="file" id="newImage" accept="image/*">
            </div>
            <button class="btn-main" onclick="addNewProperty()">نشر العقار (بانتظار الموافقة)</button>
        </div>

        <!-- 4️⃣ لوحة الأدمن -->
        <div id="adminTab" class="section">
            <div id="adminLoginSection">
                <div class="form-group">
                    <label>أدخل كلمة مرور الأدمن:</label>
                    <input type="password" id="adminPassword" placeholder="****">
                </div>
                <button class="btn-main btn-admin" onclick="checkAdminPassword()">دخول لوحة التحكم</button>
            </div>
            <div id="adminDashboardSection" style="display: none;">
                <!-- قسم العقارات المعلقة -->
                <h3 style="color: #1b4332; font-size: 15px; text-align: right; border-bottom: 2px solid #c59b27; padding-bottom: 5px;">إعلانات بانتظار الموافقة</h3>
                <div id="adminPendingList"></div>
                
                <!-- قسم العقارات المنشورة -->
                <h3 style="color: #1b4332; font-size: 15px; text-align: right; border-bottom: 2px solid #1b4332; padding-bottom: 5px; margin-top: 25px;">الإعلانات المنشورة حالياً</h3>
                <div id="adminApprovedList"></div>
            </div>
        </div>

        <a href="https://www.facebook.com/share/1JERWc6Fq6/" target="_blank" class="fb-link">زيارة صفحتنا على فيسبوك</a>
    </div>

    <script>
        // تهيئة المتغيرات والبيانات بشكل آمن لمنع تعطل التطبيق
        var properties = [];
        try {
            var storedData = localStorage.getItem('tafilahRealEstate_V2');
            if (storedData) {
                properties = JSON.parse(storedData);
            }
        } catch (error) {
            console.error("حدث خطأ في قراءة البيانات، تم تصفير القائمة.");
            properties = [];
        }

        // دالة لحفظ البيانات
        function saveProperties() {
            try {
                localStorage.setItem('tafilahRealEstate_V2', JSON.stringify(properties));
            } catch (e) {
                alert("الذاكرة ممتلئة! يرجى حذف بعض الإعلانات القديمة التي تحتوي على صور.");
            }
        }

        // دالة التنقل بين التبويبات
        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(function(sec) { sec.classList.remove('active'); });
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });

            document.getElementById(tabId).classList.add('active');
            if(btn) btn.classList.add('active');
            
            if (tabId === 'browseTab') renderBrowse();
            if (tabId === 'searchTab') filterProperties();
            if (tabId === 'adminTab' && document.getElementById("adminDashboardSection").style.display === "block") {
                renderAdminDashboard();
            }
        }

        // دالة إنشاء واجهة الإعلان للزوار
        function createPropertyHTML(p) {
            var imgHtml = p.image ? '<img src="' + p.image + '" class="property-image">' : '';
            var cardClass = p.isPinned ? 'property-card pinned' : 'property-card';
            var pinBadge = p.isPinned ? '<span class="badge badge-pinned">📌 إعلان مميز / مثبت</span>' : '';
            
            return '<div class="' + cardClass + '">' +
                        pinBadge +
                        imgHtml +
                        '<div class="property-title">' + (p.type || '') + ' - ' + (p.location || '') + '</div>' +
                        '<div class="property-price">السعر: ' + (p.price || 'غير محدد') + '</div>' +
                        '<div class="property-details">' + (p.details || '') + '</div>' +
                        '<a href="tel:' + (p.phone || '') + '" class="property-phone">📞 هاتف: ' + (p.phone || '') + '</a>' +
                   '</div>';
        }

        // دالة فرز وترتيب الإعلانات (المثبت أولاً، ثم الأحدث للأقدم)
        function sortProperties(listArray) {
            return listArray.sort(function(a, b) {
                if (a.isPinned && !b.isPinned) return -1;
                if (!a.isPinned && b.isPinned) return 1;
                return b.id - a.id;
            });
        }

        // عرض العقارات للزوار
        function renderBrowse() {
            var list = document.getElementById("approvedPropertiesList");
            var approved = properties.filter(function(p) { return p.status === 'approved'; });
            
            sortProperties(approved);
            
            if(approved.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#777; font-size:13px;'>لا توجد إعلانات منشورة حالياً.</p>";
                return;
            }
            
            var html = '';
            for(var i = 0; i < approved.length; i++) {
                html += createPropertyHTML(approved[i]);
            }
            list.innerHTML = html;
        }

        // إضافة عقار جديد
        function addNewProperty() {
            var type = document.getElementById("newType").value;
            var loc = document.getElementById("newLocation").value;
            var price = document.getElementById("newPrice").value;
            var details = document.getElementById("newDetails").value;
            var phone = document.getElementById("newUserPhone").value;
            var imageInput = document.getElementById("newImage");

            if(!loc || !phone) {
                alert("يرجى تعبئة المنطقة ورقم الهاتف على الأقل!");
                return;
            }

            var id = Date.now(); 

            if (imageInput.files && imageInput.files[0]) {
                var file = imageInput.files[0];
                if (file.size > 2 * 1024 * 1024) {
                    alert("حجم الصورة كبير جداً، يرجى اختيار صورة أصغر من 2 ميجا.");
                    return;
                }
                var reader = new FileReader();
                reader.onload = function(e) {
                    saveNewRecord(id, type, loc, price, details, phone, e.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                saveNewRecord(id, type, loc, price, details, phone, "");
            }
        }

        function saveNewRecord(id, type, loc, price, details, phone, img) {
            properties.unshift({
                id: id,
                type: type,
                location: loc,
                price: price ? price + " دينار" : "غير محدد",
                details: details,
                phone: phone,
                image: img,
                status: "pending",
                isPinned: false
            });
            saveProperties();
            alert("تم إرسال إعلانك بنجاح! سيتم مراجعته من قبل الإدارة.");
            
            document.getElementById("newLocation").value = "";
            document.getElementById("newPrice").value = "";
            document.getElementById("newDetails").value = "";
            document.getElementById("newUserPhone").value = "";
            document.getElementById("newImage").value = "";
        }

        // البحث
        function filterProperties() {
            var query = document.getElementById("searchInput").value.toLowerCase();
            var list = document.getElementById("searchResultsList");
            var filtered = properties.filter(function(p) { 
                return p && p.status === 'approved' && 
                ((p.location && p.location.toLowerCase().indexOf(query) !== -1) || 
                 (p.type && p.type.toLowerCase().indexOf(query) !== -1) || 
                 (p.details && p.details.toLowerCase().indexOf(query) !== -1));
            });

            sortProperties(filtered);

            if (filtered.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#777; font-size:13px;'>لا توجد نتائج مطابقة.</p>";
                return;
            }

            var html = '';
            for(var i = 0; i < filtered.length; i++) {
                html += createPropertyHTML(filtered[i]);
            }
            list.innerHTML = html;
        }

        // تسجيل دخول الإدارة
        function checkAdminPassword() {
            if(document.getElementById("adminPassword").value === "MKF@mkf1999") {
                document.getElementById("adminLoginSection").style.display = "none";
                document.getElementById("adminDashboardSection").style.display = "block";
                renderAdminDashboard();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        // تصميم بطاقة الأدمن
        function createAdminCardHTML(p, isPending) {
            var imgHtml = p.image ? '<img src="' + p.image + '" class="property-image">' : '';
            var badgeHtml = isPending 
                ? '<span class="badge badge-pending">بانتظار الموافقة</span>' 
                : (p.isPinned ? '<span class="badge badge-approved">إعلان منشور</span><span class="badge badge-pinned">📌 مثبت في الأعلى</span>' : '<span class="badge badge-approved">إعلان منشور</span>');

            var buttonsHtml = '';
            var cardClass = (p.isPinned && !isPending) ? 'property-card pinned' : 'property-card';

            if (isPending) {
                buttonsHtml = 
                '<div id="actions_' + p.id + '" class="actions-btn">' +
                    '<button class="btn-sm btn-approve" onclick="approveAd(' + p.id + ')">قبول ✅</button>' +
                    '<button class="btn-sm btn-delete" onclick="showConfirm(' + p.id + ')">رفض ❌</button>' +
                '</div>';
            } else {
                var pinBtnText = p.isPinned ? 'إلغاء التثبيت 🔓' : 'تثبيت في الأعلى 📌';
                var pinBtnClass = p.isPinned ? 'btn-sm btn-unpin' : 'btn-sm btn-pin';
                
                buttonsHtml = 
                '<div id="actions_' + p.id + '" class="actions-btn">' +
                    '<button class="' + pinBtnClass + '" onclick="togglePinAd(' + p.id + ')">' + pinBtnText + '</button>' +
                    '<button class="btn-sm btn-delete" onclick="showConfirm(' + p.id + ')">حذف 🗑️</button>' +
                '</div>';
            }

            var confirmBoxHtml = 
                '<div id="confirm_' + p.id + '" class="confirm-box">' +
                    '<span class="confirm-text">هل أنت متأكد من الحذف نهائياً؟</span>' +
                    '<div class="confirm-actions">' +
                        '<button class="btn-sm" style="background:#dc3545; color:#fff;" onclick="deleteAd(' + p.id + ')">نعم، احذف</button>' +
                        '<button class="btn-sm" style="background:#6c757d; color:#fff;" onclick="hideConfirm(' + p.id + ')">تراجع</button>' +
                    '</div>' +
                '</div>';

            return '<div class="' + cardClass + '">' +
                        badgeHtml +
                        imgHtml +
                        '<div class="property-title">' + (p.type || '') + ' - ' + (p.location || '') + '</div>' +
                        '<div class="property-price">السعر: ' + (p.price || 'غير محدد') + '</div>' +
                        '<div class="property-details">' + (p.details || '') + '</div>' +
                        '<div class="property-phone">هاتف: ' + (p.phone || '') + '</div>' +
                        buttonsHtml +
                        confirmBoxHtml +
                   '</div>';
        }

        // عرض لوحة الإدارة
        function renderAdminDashboard() {
            var pendingList = document.getElementById("adminPendingList");
            var approvedList = document.getElementById("adminApprovedList");
            
            var sortedProperties = properties.slice();
            sortProperties(sortedProperties);

            var pendingHtml = '';
            var approvedHtml = '';

            for(var i = 0; i < sortedProperties.length; i++) {
                if(sortedProperties[i].status === 'pending') {
                    pendingHtml += createAdminCardHTML(sortedProperties[i], true);
                } else if(sortedProperties[i].status === 'approved') {
                    approvedHtml += createAdminCardHTML(sortedProperties[i], false);
                }
            }

            pendingList.innerHTML = pendingHtml || "<p style='text-align:center; color:#777;'>لا توجد إعلانات معلقة.</p>";
            approvedList.innerHTML = approvedHtml || "<p style='text-align:center; color:#777;'>لا توجد إعلانات منشورة.</p>";
        }

        function togglePinAd(id) {
            for(var i = 0; i < properties.length; i++) {
                if(properties[i].id === id) {
                    properties[i].isPinned = !properties[i].isPinned;
                    break;
                }
            }
            saveProperties();
            renderAdminDashboard();
            renderBrowse();
        }

        function approveAd(id) {
            for(var i = 0; i < properties.length; i++) {
                if(properties[i].id === id) {
                    properties[i].status = 'approved';
                    break;
                }
            }
            saveProperties();
            renderAdminDashboard();
        }

        function showConfirm(id) {
            document.getElementById('actions_' + id).style.display = 'none';
            document.getElementById('confirm_' + id).style.display = 'flex';
        }

        function hideConfirm(id) {
            document.getElementById('confirm_' + id).style.display = 'none';
            document.getElementById('actions_' + id).style.display = 'flex';
        }

        function deleteAd(id) {
            var newArray = [];
            for(var i = 0; i < properties.length; i++) {
                if(properties[i].id !== id) {
                    newArray.push(properties[i]);
                }
            }
            properties = newArray;
            saveProperties();
            renderAdminDashboard();
            renderBrowse(); 
        }

        renderBrowse();
    </script>
